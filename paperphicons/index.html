<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>PaperPhicons</title>
		<meta name="description" content="Make a paper prism or frustum with 3 to 24 sides: print, cut and fold." />
		<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="../css/app.css" />
		<script type="importmap">
			{
				"imports": {
					"three": "../vendor/three.module.js",
					"three/addons/controls/OrbitControls.js": "../vendor/OrbitControls.js",
					"jspdf": "../vendor/jspdf.js"
				}
			}
		</script>
	</head>
	<body>
		<header class="site">
			<a class="home" href="../">Paper Prototyping Lite</a>
			<nav>
				<a href="../paperblox/">PaperBlox</a>
				<a href="./" aria-current="page">PaperPhicons</a>
			</nav>
		</header>
		<main>
			<h1>PaperPhicons</h1>
			<p class="lead">A paper prism or frustum with 3 to 24 sides, with lids, a colour and images.</p>
			<div class="app">
				<form id="controls" class="controls" onsubmit="return false">
					<p id="status" class="status">Loading…</p>
				</form>
				<div class="previews">
					<section class="preview sheet">
						<h2>Sheet (A4)</h2>
						<div id="sheet"></div>
					</section>
					<section class="preview">
						<h2>3D view</h2>
						<div id="view3d" class="view3d"></div>
					</section>
				</div>
			</div>
		</main>
		<script type="module" src="../js/lib/vendor-check.js"></script>
	</body>
</html>
