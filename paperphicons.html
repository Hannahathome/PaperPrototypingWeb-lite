<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperPhicons – Prism / Frustum</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --panel: #f4f4f5; --text: #18181b; --muted: #52525b; --line: #d4d4d8;
    --accent: #c2410c; --accent-text: #ffffff; --warn: #b45309; --error: #b91c1c;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --panel: #27272a; --text: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46;
            --accent: #fb923c; --accent-text: #18181b; --warn: #fbbf24; --error: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  a { color: var(--accent); }
  header { display: flex; align-items: baseline; gap: 1rem; padding: 0.75rem 1rem; border-bottom: 1px solid var(--line); }
  header a.home { color: var(--text); font-weight: 600; text-decoration: none; }
  main { max-width: 76rem; margin: 0 auto; padding: 1rem; }
  h1 { margin: 0.5rem 0; font-size: 1.6rem; }
  .lead { max-width: 42rem; color: var(--muted); }

  .app { display: grid; grid-template-columns: minmax(15rem, 19rem) 1fr; gap: 1.5rem; align-items: start; margin-top: 1rem; }
  @media (max-width: 60rem) { .app { grid-template-columns: 1fr; } }
  .controls { display: grid; gap: 1rem; }
  fieldset { display: grid; gap: 0.5rem; margin: 0; padding: 0.75rem; border: 1px solid var(--line); border-radius: 0.5rem; }
  legend { padding: 0 0.25rem; font-weight: 600; }
  label { display: grid; gap: 0.15rem; font-size: 0.9rem; }
  label.check { display: flex; align-items: center; gap: 0.5rem; }
  input, select, button { font: inherit; }
  input[type=number], input[type=text], select {
    width: 100%; padding: 0.3rem 0.4rem; border: 1px solid var(--line); border-radius: 0.25rem;
    background: var(--bg); color: var(--text);
  }
  button { padding: 0.45rem 0.9rem; border: 0; border-radius: 0.3rem; background: var(--accent);
           color: var(--accent-text); font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .previews { display: grid; gap: 1rem; min-width: 0; }
  .preview { border: 1px solid var(--line); border-radius: 0.5rem; background: var(--panel); overflow: hidden; }
  .preview h2 { margin: 0; padding: 0.4rem 0.75rem; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  #sheet svg { display: block; width: 100%; height: auto; background: #ffffff; }
  #view3d { height: 22rem; }
  #view3d canvas { display: block; }

  .status { min-height: 1.5em; font-size: 0.9rem; }
  .status.error { color: var(--error); }
  .status.warn { color: var(--warn); }
</style>
</head>
<body>
<header>
  <a class="home" href="index.html">Paper Prototyping Lite</a>
  <a href="paperblox.html">PaperBlox</a>
</header>
<main>
  <h1>PaperPhicons</h1>
  <p class="lead">A paper prism or frustum with 3 to 24 sides, with lids, a colour and images.</p>
  <div class="app">
    <form id="controls" class="controls" onsubmit="return false">
      <p id="status" class="status">Loading…</p>
    </form>
    <div class="previews">
      <section class="preview">
        <h2>Sheet (A4)</h2>
        <div id="sheet"></div>
      </section>
      <section class="preview">
        <h2>3D view</h2>
        <div id="view3d"></div>
      </section>
    </div>
  </div>
</main>

<!-- Libraries: jsPDF for the PDF export, three.js for the 3D view. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>

<script type="module">
// Setup check (phase 1): proves that jsPDF and three.js load, and shows a placeholder shape in
// the 3D view. Replaced by the PaperPhicons app in phase 4.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const { jsPDF } = window.jspdf;
const status = document.getElementById('status');

try {
  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
  const [w, h] = [pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight()];

  const host = document.getElementById('view3d');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  host.append(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, 1, 1, 1000);
  camera.position.set(60, 50, 80);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const box = new THREE.Mesh(new THREE.BoxGeometry(30, 30, 30), new THREE.MeshStandardMaterial({ color: 0xf4f4f5 }));
  box.add(new THREE.LineSegments(new THREE.EdgesGeometry(box.geometry), new THREE.LineBasicMaterial({ color: 0x18181b })));
  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(50, 80, 60);
  scene.add(box, new THREE.AmbientLight(0xffffff, 1.5), light);

  new ResizeObserver(() => {
    renderer.setSize(host.clientWidth, host.clientHeight);
    camera.aspect = host.clientWidth / host.clientHeight;
    camera.updateProjectionMatrix();
  }).observe(host);
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

  status.textContent = `Setup OK: three.js r${THREE.REVISION}, jsPDF ${jsPDF.version} (A4 = ${w.toFixed(0)} × ${h.toFixed(0)} mm).`;
} catch (error) {
  status.className = 'status error';
  status.textContent = `Setup failed: ${error instanceof Error ? error.message : String(error)}`;
  throw error;
}
</script>
</body>
</html>
